name: Crawl kyou data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Crawl
        run: python crawler.py --deep --out output

      - name: Upload crawl artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyou-data
          path: output/
          retention-days: 7
