name: Crawl kyou data

on:
  workflow_dispatch:
    inputs:
      tree_fallback:
        description: "批量标签接口失败时，允许逐张谱面 GET（请求量较大，仅调试时打开）"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Crawl
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.tree_fallback }}" = "true" ]; then EXTRA="--tree-fallback"; fi
          xvfb-run -a python crawler.py --headful --out output $EXTRA

      - name: Upload crawl artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyou-data
          path: output/
          retention-days: 7
          if-no-files-found: warn
